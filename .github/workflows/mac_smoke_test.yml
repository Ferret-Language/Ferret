name: macos-smoke

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    permissions:
      contents: read
    name: smoke-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-latest
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true

      - name: Install LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm lld
          LLVM_BIN="$(brew --prefix llvm)/bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          echo "FERRET_LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          echo "FERRET_LLD_BIN=$LLD_BIN" >> "$GITHUB_ENV"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "$LLD_BIN" >> "$GITHUB_PATH"

      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          which go
          go version
          test -n "${FERRET_LLVM_BIN:-}"
          test -n "${FERRET_LLD_BIN:-}"

      - name: Build Ferret bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$FERRET_LLVM_BIN:$FERRET_LLD_BIN:$PATH"
          ./build.sh

      - name: Verify bundled artifacts
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$FERRET_LLVM_BIN:$FERRET_LLD_BIN:$PATH"
          test -x build/core/bin/ferret
          test -f build/core/libs/ferret_runtime.a
          test -f build/toolchain/bin/clang
          test -f build/toolchain/bin/ld64.lld

      - name: Initialize and run sample project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/build/toolchain/bin:$GITHUB_WORKSPACE/build/core/bin:$PATH"
          WORKDIR="$RUNNER_TEMP/ferret-smoke"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          printf '\n\n' | ferret init smokeproject
          test -f fer.ret
          test -f main.fer

          RUN_LOG="$RUNNER_TEMP/ferret-smoke-run.log"
          if ! ferret run -logformat normal 2>&1 | tee "$RUN_LOG"; then
            echo "ferret run failed; full output follows:"
            cat "$RUN_LOG"
            exit 1
          fi
          grep -F "Hello from Ferret!" "$RUN_LOG"
