name: macos-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    permissions:
      contents: read
    name: smoke-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true

      - name: Install LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          which go
          go version

      - name: Build Ferret bundle
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh

      - name: Verify bundled artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -x build/core/bin/ferret
          test -f build/core/libs/ferret_runtime.a
          test -f build/toolchain/bin/clang
          test -f build/toolchain/bin/ld64.lld

      - name: Initialize and run sample project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/build/toolchain/bin:$GITHUB_WORKSPACE/build/core/bin:$PATH"
          WORKDIR="$RUNNER_TEMP/ferret-smoke"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          printf '\n\n' | ferret init smokeproject
          test -f fer.ret
          test -f main.fer

          OUTPUT="$(ferret run -logformat normal 2>&1)"
          printf '%s\n' "$OUTPUT"
          grep -F "Hello from Ferret!" <<<"$OUTPUT"
