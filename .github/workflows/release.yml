name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: macos
            arch: amd64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install LLVM toolchain (linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          mkdir -p "$HOME/.local/llvm-bin"
          ln -sf /usr/bin/clang-18 "$HOME/.local/llvm-bin/clang"
          ln -sf /usr/bin/clang++-18 "$HOME/.local/llvm-bin/clang++"
          ln -sf /usr/bin/lld-18 "$HOME/.local/llvm-bin/lld"
          ln -sf /usr/bin/ld.lld-18 "$HOME/.local/llvm-bin/ld.lld"
          echo "$HOME/.local/llvm-bin" >> "$GITHUB_PATH"

      - name: Verify Linux clang version
        if: matrix.os == 'linux'
        run: |
          clang --version
          ld.lld --version

      - name: Setup MSYS2 toolchain
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld

      - name: Add MSYS2 to PATH
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Pack bundle (unix)
        if: matrix.os != 'windows'
        run: |
          rm -rf build dist
          go run ./tools

      - name: Pack bundle (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          go run ./tools

      - name: Verify bundled clang (unix)
        if: matrix.os != 'windows'
        run: |
          test -f build/toolchain/bin/clang

      - name: Verify bundled clang (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path "build\toolchain\bin\clang.exe")) {
            throw "bundled clang.exe not found"
          }

      - name: Archive (unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p dist
          tar -czf "dist/ferret-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C build .

      - name: Archive (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\*" -DestinationPath "dist\ferret-${{ matrix.os }}-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferret-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/ferret-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dist/ferret-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ferret-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite_files: true
          make_latest: true
