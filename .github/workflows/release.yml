name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
          - runner: macos-latest
          - runner: macos-15-intel
          - runner: windows-latest

    steps:
      # Fast shallow checkout (no submodules yet)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # Manually init submodules (full clone, fixes dumb http issue)
      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set artifact name (unix)
        if: runner.os != 'Windows'
        run: |
          echo "TARGET_GOOS=$(go env GOOS)" >> "$GITHUB_ENV"
          echo "TARGET_GOARCH=$(go env GOARCH)" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=ferret-$(go env GOOS)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - name: Set artifact name (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TARGET_GOOS=$(go env GOOS)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_GOARCH=$(go env GOARCH)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARTIFACT_NAME=ferret-$(go env GOOS)-$(go env GOARCH)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Clean generated files (unix)
        if: runner.os != 'Windows'
        run: rm -rf dist stage libs

      - name: Clean generated files (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force stage, dist, libs -ErrorAction SilentlyContinue

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Add MSYS2 to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Bootstrap libs/toolchain (unix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go run ./tools

      - name: Bootstrap libs/toolchain (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go run .\tools

      - name: Build (unix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: |
          rm -rf dist stage
          mkdir -p "stage/$ARTIFACT_NAME/bin" dist
          go build -v -o "stage/$ARTIFACT_NAME/bin/ferret"
          cp -R libs "stage/$ARTIFACT_NAME/"
          cp LICENSE README.md "stage/$ARTIFACT_NAME/"

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          Remove-Item -Recurse -Force stage, dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "stage\$env:ARTIFACT_NAME\bin", dist | Out-Null
          go build -v -o "stage\$env:ARTIFACT_NAME\bin\ferret.exe"
          Copy-Item -Recurse -Force libs "stage\$env:ARTIFACT_NAME\"
          Copy-Item -Force LICENSE, README.md "stage\$env:ARTIFACT_NAME\"

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf "dist/${ARTIFACT_NAME}.tar.gz" -C "stage/${ARTIFACT_NAME}" .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "stage\$env:ARTIFACT_NAME\*" -DestinationPath "dist/$env:ARTIFACT_NAME.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clean dist
        run: rm -rf dist

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ferret-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
